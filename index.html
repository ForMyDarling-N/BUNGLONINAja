<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0f1c">
<title>BUNGLONIN - Rute Kurir</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0a0f1c; --panel:#121a2b; --panel2:#1a2438; --line:#2a3a55;
  --txt:#f5f8ff; --muted:#9fb0cc; --muted2:#6f82a3;
  --orange:#ff8b2b; --orange-d:#241407;
  --green:#20c58a; --green-d:#04241a;
  --blue:#5fa8ff; --red:#ff5c73; --red-d:#ffd9df;
  --radius:16px; --radius-sm:12px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior-y:contain;
  padding-bottom:calc(80px + var(--safe-b));
  color-scheme:dark;
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;border-radius:var(--radius-sm);font-weight:700;transition:transform .06s ease,filter .15s ease;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}

/* TOP BAR */
.top{
  position:sticky;top:0;z-index:900;
  background:rgba(10,15,28,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + var(--safe-t)) 16px 10px;
  display:flex;align-items:center;gap:12px;
}
.brand{font-size:19px;font-weight:900;letter-spacing:.3px}
.brand span{color:var(--orange)}
.tag{font-size:11px;color:var(--muted2);letter-spacing:.2px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--txt);
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:bold;
}

/* SHELL */
.shell{max-width:1200px;margin:auto;padding:14px 14px 24px}
.tabbar{display:none;gap:6px;margin-bottom:14px}
@media(min-width:900px){
  .tabbar{display:flex}
  body{padding-bottom:24px}
  .bottomnav{display:none!important}
}
.tabbar button{flex:1;padding:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:14px}
.tabbar button.active{background:var(--orange);color:var(--orange-d);border-color:var(--orange)}

/* LAYOUT */
.layout{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.layout{grid-template-columns:400px minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 10px;letter-spacing:.2px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}

/* FORM */
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:#0c1424;color:var(--txt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;font-size:15px}
.field textarea{min-height:84px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--muted2)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;font-size:15px}
.btn.primary{background:var(--orange);color:var(--orange-d)}
.btn.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.green{background:var(--green);color:var(--green-d)}
.btn.danger{background:#3a1f2c;color:var(--red-d);border:1px solid #5a2a3c}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:9px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}

/* UPLOAD */
.uploadbox{border:1.5px dashed #425a7d;background:#0c1424;border-radius:var(--radius);padding:20px 16px;text-align:center}
.uploadbox strong{display:block;margin-bottom:6px}
.uploadbox input{display:block;width:100%;margin:10px 0 4px;color:var(--muted);font-size:13px}
.thumbs{display:flex;gap:8px;overflow:auto;margin-top:12px;padding-bottom:4px}
.thumbs img{height:100px;border-radius:10px;border:1px solid var(--line);background:#070c16;object-fit:cover}

/* PROGRESS */
.progress{height:6px;background:#0c1424;border-radius:3px;overflow:hidden;margin-top:10px}
.progress > div{height:100%;background:var(--orange);width:0;transition:width .2s}

/* STOP CARD */
.stop{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
.stop.done{opacity:.55}
.stop.done .stop-title{text-decoration:line-through;text-decoration-thickness:2px}
.stop-top{display:flex;align-items:center;gap:12px}
.num{width:42px;height:42px;flex:none;border-radius:12px;background:var(--orange);color:var(--orange-d);font-size:18px;font-weight:900;display:grid;place-items:center}
.stop.done .num{background:#3a4a66;color:#c9d6ea}
.stop-title{font-weight:800;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.pill.shopee{background:#4a2a18;color:#ffb66f}
.pill.grab{background:#0f3a2c;color:#7bffc4}
.addr{color:#dbe5f5;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted2);font-weight:700}
.code{background:#2a3a55;padding:2px 6px;border-radius:4px;color:#fff;font-family:monospace;font-size:12px}
.warn{color:#ffb66f;font-size:12px;font-weight:700}

.stop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stop-actions .btn{min-height:44px;font-size:14px}
.stop-actions .wide{grid-column:1/-1}

/* MAP */
#map{height:46vh;min-height:300px;border-radius:var(--radius);overflow:hidden;background:#152137;position:relative}
.map-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.map-tools .btn{min-height:44px;font-size:13px}
.fullscreen-map{position:fixed!important;inset:0!important;z-index:2000!important;height:100vh!important;width:100vw!important;border-radius:0!important;margin:0!important}

/* BOTTOM NAV */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:800;background:rgba(10,15,28,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;padding:6px 8px calc(6px + var(--safe-b))}
.bottomnav button{flex:1;background:transparent;color:var(--muted2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:700}
.bottomnav button.active{color:var(--orange)}

/* FAB & TOAST */
.fab{position:fixed;right:16px;bottom:calc(80px + var(--safe-b) + 12px);width:58px;height:58px;border-radius:50%;background:var(--orange);color:var(--orange-d);font-size:26px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(255,139,43,.45);z-index:850}
@media(min-width:900px){.fab{display:none}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b) + 10px);transform:translateX(-50%) translateY(20px);background:#1b2a44;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:#1f6b4f;background:#0f3a2c;color:#b8f5dc}
.toast.err{border-color:#5a2a3c;background:#3a1f2c;color:#ffd9df}

/* SHEET */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1500;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1600;background:var(--panel);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line);padding:16px 16px calc(16px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease;max-height:90vh;overflow:auto}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:44px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 14px}

/* EMPTY */
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.empty .big{font-size:24px;font-weight:bold;margin-bottom:8px}
.empty strong{display:block;color:var(--txt);margin-bottom:4px;font-size:15px}
.hidden{display:none!important}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sec-title h2{margin:0}
.sec-title .count{font-size:12px;color:var(--muted2);font-weight:700}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="brand">BUNGLO<span>NIN</span></div>
    <div class="tag">Penyatu rute ShopeeFood + Grab</div>
  </div>
  <div class="right">
    <span class="chip"><span class="dot"></span><span id="orderCount">0 Titik</span></span>
    <button class="icon-btn" id="locBtnTop" title="Lokasi saya">LOC</button>
  </div>
</header>

<main class="shell">
  <nav class="tabbar">
    <button class="active" data-tab="route" onclick="showTab('route')">Rute & Peta</button>
    <button data-tab="add" onclick="showTab('add')">Tambah Titik</button>
    <button data-tab="manage" onclick="showTab('manage')">Daftar Titik</button>
  </nav>

  <div class="layout">
    <section>
      <!-- ADD TAB -->
      <div class="card tabpage" id="tab-add">
        <h2>Scan Screenshot</h2>
        <p class="muted">Pilih screenshot aplikasi ojol. Sistem akan memfilter peta dan hanya mengambil alamat serta kode pesanan.</p>
        <div class="uploadbox">
          <strong>Pilih foto dari galeri</strong>
          <input id="photoInput" type="file" accept="image/*" multiple>
        </div>
        <div id="thumbs" class="thumbs"></div>
        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="ocrBtn" disabled>Scan Teks</button>
          <button class="btn secondary" id="clearPhotosBtn">Hapus</button>
        </div>
        <div class="progress hidden" id="ocrProgress"><div></div></div>
        <div class="field">
          <label>Hasil Scan (Bisa diedit manual jika ada yang salah)</label>
          <textarea id="ocrText" placeholder="Hasil scan akan muncul di sini..." style="min-height:120px"></textarea>
        </div>
        <div class="row">
          <button class="btn primary" id="parseOcrBtn">Ekstrak ke Titik Rute</button>
        </div>
      </div>

      <!-- ADD MANUAL -->
      <div class="card tabpage" id="tab-add-manual">
        <h2>Tambah Manual</h2>
        <div class="field">
          <label>Platform</label>
          <select id="platform">
            <option value="ShopeeFood">ShopeeFood / SPX</option>
            <option value="Grab">GrabExpress</option>
          </select>
        </div>
        <div class="field">
          <label>Alamat Tujuan</label>
          <textarea id="dropoff" placeholder="Ketik alamat lengkap..."></textarea>
        </div>
        <div class="row">
          <button class="btn primary" id="addOrderBtn">Tambah ke Rute</button>
          <button class="btn secondary" id="clearFormBtn">Kosongkan</button>
        </div>
      </div>
    </section>

    <section>
      <!-- ROUTE TAB -->
      <div class="card tabpage" id="tab-route">
        <div class="sec-title">
          <h2>Peta Rute</h2>
          <span class="count" id="mapLabel">0 Titik</span>
        </div>
        <div id="map"></div>
        <div class="map-tools">
          <button class="btn secondary" id="locBtn">Lokasi Saya</button>
          <button class="btn secondary" id="recalcBtn">Susun Ulang</button>
          <button class="btn primary" id="allMapsBtn">Buka Google Maps</button>
          <button class="btn secondary" id="fullscreenBtn">Perbesar</button>
        </div>
      </div>

      <!-- MANAGE TAB -->
      <div class="card tabpage" id="tab-manage">
        <div class="sec-title">
          <h2>Daftar Kunjungan</h2>
          <span class="count" id="listCount">0 Titik</span>
        </div>
        <div class="row" style="margin-bottom:10px">
          <button class="btn secondary small" id="markAllBtn">Tandai Semua Selesai</button>
          <button class="btn danger small" id="clearDoneBtn">Hapus Selesai</button>
        </div>
        <div id="stopList"></div>
      </div>
    </section>
  </div>
</main>

<nav class="bottomnav">
  <button class="active" data-tab="route" onclick="showTab('route')">Peta</button>
  <button data-tab="add" onclick="showTab('add')">Tambah</button>
  <button data-tab="manage" onclick="showTab('manage')">Daftar</button>
</nav>

<button class="fab" id="fabAdd" aria-label="Tambah titik">+</button>
<div class="toast" id="toast"></div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheetBody"></div>
</div>

<input id="importInput" type="file" accept="application/json" class="hidden">
<button id="closeFullscreenBtn" class="fab hidden" style="background:var(--red);color:white;bottom:auto;top:14px;right:14px;width:48px;height:48px;font-size:16px;font-weight:bold">X</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const LS_KEY = 'bunglonin_state_v6';

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, type=''){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._tm);
  t._tm = setTimeout(()=> t.className = 'toast ' + type, 2600);
}

let photos = [];
let orders = [];
let nextId = 1;
let currentLoc = null;
let map = null;
let markers = [];
let routeLine = null;
let geoCache = {};
let activeTab = 'route';

function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({orders, nextId, currentLoc})); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(Array.isArray(d.orders)) orders = d.orders;
    if(typeof d.nextId === 'number') nextId = d.nextId;
    if(d.currentLoc) currentLoc = d.currentLoc;
  }catch(e){}
}

function showTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tabpage').forEach(x=>x.classList.add('hidden'));
  if(tab === 'add'){
    $('tab-add').classList.remove('hidden');
    $('tab-add-manual').classList.remove('hidden');
  }else{
    const el = $('tab-'+tab);
    if(el) el.classList.remove('hidden');
  }
  document.querySelectorAll('.tabbar button, .bottomnav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if(map) setTimeout(()=>map.invalidateSize(), 150);
}

// ================= OCR & PARSING =================
$('photoInput').addEventListener('change', e=>{
  photos = Array.from(e.target.files||[]);
  $('thumbs').innerHTML = '';
  photos.forEach(f=>{
    const im = document.createElement('img');
    im.src = URL.createObjectURL(f);
    $('thumbs').appendChild(im);
  });
  $('ocrBtn').disabled = !photos.length;
});

$('clearPhotosBtn').onclick = ()=>{
  $('photoInput').value = '';
  photos = [];
  $('thumbs').innerHTML = '';
  $('ocrBtn').disabled = true;
  $('ocrProgress').classList.add('hidden');
};

function loadOCR(){
  return new Promise((resolve, reject)=>{
    if(window.Tesseract) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = resolve;
    s.onerror = ()=> reject(new Error('CDN OCR gagal'));
    document.head.appendChild(s);
  });
}

$('ocrBtn').onclick = async ()=>{
  if(!photos.length) return;
  const btn = $('ocrBtn');
  btn.disabled = true;
  const prog = $('ocrProgress');
  const bar = prog.firstElementChild;
  prog.classList.remove('hidden');
  try{
    await loadOCR();
    const all = [];
    for(let i=0;i<photos.length;i++){
      const result = await Tesseract.recognize(photos[i], 'ind+eng', {
        logger: m=>{
          if(m.status === 'recognizing text') bar.style.width = Math.round((m.progress||0)*100) + '%';
        }
      });
      all.push(result.data.text || '');
    }
    $('ocrText').value = all.join('\n\n');
    toast('Scan selesai', 'ok');
  }catch(err){
    toast('Scan gagal: ' + err.message, 'err');
  }finally{
    btn.disabled = false;
    setTimeout(()=>prog.classList.add('hidden'), 1500);
  }
};

// ================= IMPROVED PARSER =================
function isAddressLike(str) {
  if (!str || str.length < 12) return false;
  // Skip jelas-jelas bukan alamat
  if (/(petunjuk arah|detail pesanan|hubungi|masalah|pengirim|pesanan selesai|biaya|total|estimasi|driver|kode pesanan|order id|ambil di|antar ke|jarak|menit|rp\.|idr)/i.test(str)) return false;
  if (/^[0-9\s\.\-]+$/.test(str)) return false;
  
  const keywords = /(jalan|jl\.|jl |blok|no\.|no |nomor|kav|kec|kab|kota|desa|kelurahan|kel |perumahan|komplek|kompleks|gedung|ruko|rt\/rw|rt |rw |patokan|depan|belakang|samping|seberang|gg\.|gang |perum |graha|residence|apartment|apartemen)/i;
  return keywords.test(str) || (str.length > 25 && /\d/.test(str));
}

function extractCode(str) {
  // Lebih banyak pola kode pengambilan
  const patterns = [
    /#[A-Z0-9]{4,}/i,
    /\bSPX[A-Z0-9]{6,}\b/i,
    /\b[A-Z]{2,3}[0-9]{4,}\b/,
    /\b[0-9]{2,}[A-Z]{2,}[0-9A-Z]{2,}\b/
  ];
  for (const p of patterns) {
    const m = str.match(p);
    if (m) return m[0];
  }
  return '';
}

$('parseOcrBtn').onclick = ()=>{
  let rawText = $('ocrText').value;
  if(!rawText.trim()){ toast('Teks kosong', 'err'); return; }

  let lines = rawText.split('\n').map(s => s.trim()).filter(s => s.length > 1);
  
  // ===== MERGE baris yang nyambung (biar 1 alamat nggak jadi 2) =====
  let merged = [];
  for (let line of lines) {
    if (merged.length === 0) {
      merged.push(line);
      continue;
    }
    const prev = merged[merged.length - 1];
    const prevIsAddr = isAddressLike(prev);
    const currIsAddr = isAddressLike(line);
    
    // Gabung kalau keduanya alamat, atau lanjutan yang pendek
    if ((prevIsAddr && currIsAddr) || 
        (prevIsAddr && line.length > 4 && !extractCode(line) && !/^[0-9]+\./.test(line))) {
      merged[merged.length - 1] = prev + ' ' + line;
    } else {
      merged.push(line);
    }
  }

  let extracted = [];
  let currentPlatform = /grab/i.test(rawText) ? "Grab" : "ShopeeFood";
  let currentCode = "";

  for (let i = 0; i < merged.length; i++) {
    let line = merged[i];

    // Skip sampah
    if (/(petunjuk arah|detail pesanan|hubungi|masalah|pengirim|pesanan selesai|biaya|total|estimasi|driver)/i.test(line)) continue;

    // Ambil kode
    const codeInLine = extractCode(line);
    if (codeInLine) {
      currentCode = codeInLine;
      // Kalau baris cuma kode doang, lanjut
      if (line.replace(codeInLine, '').trim().length < 8) continue;
    }

    if (isAddressLike(line)) {
      let cleanAddr = line
        .replace(/^(?:Titik\s*|Stop\s*|Tujuan\s*)?[1-9][0-9]?[\s\.\-\)]+/i, '')
        .replace(extractCode(line), '')
        .trim();

      if (cleanAddr.length > 10) {
        extracted.push({
          platform: currentPlatform,
          code: currentCode || extractCode(line) || '',
          address: cleanAddr
        });
        currentCode = ""; // reset setelah dipakai
      }
    }
  }

  // Fallback kalau terlalu ketat
  if (extracted.length === 0) {
    merged.filter(l => l.length > 22).forEach(l => {
      const code = extractCode(l);
      const addr = l.replace(code, '').trim();
      if (addr.length > 12) {
        extracted.push({ platform: currentPlatform, code, address: addr });
      }
    });
  }

  // Hapus duplikat alamat
  const unique = [];
  const seen = new Set();
  extracted.forEach(item => {
    const key = item.address.toLowerCase().replace(/\s+/g, ' ').slice(0, 60);
    if (!seen.has(key) && item.address.length > 10) {
      seen.add(key);
      unique.push(item);
    }
  });

  if (unique.length === 0) {
    toast('Tidak ada alamat terdeteksi. Coba edit manual di kotak teks.', 'err');
    return;
  }

  let addedCount = 0;
  unique.forEach(item => {
    orders.push({
      id: nextId++,
      platform: item.platform,
      name: `Titik ${orders.length + 1}`,
      code: item.code,
      dropoff: item.address,
      done: false,
      coords: null
    });
    addedCount++;
  });

  if (addedCount > 0) {
    render();
    saveState();
    showTab('manage');
    toast(`${addedCount} titik berhasil diekstrak`, 'ok');
    geocodeOrders().then(() => {
      optimize();
      render();
      drawMap();
      saveState();
    });
  }
};

// ================= GEO & MAP =================
async function geocode(address) {
  if (!address) return null;
  const key = address.toLowerCase().trim();
  if (geoCache[key] !== undefined) return geoCache[key];

  try {
    const q = encodeURIComponent(address + ', Indonesia');
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=id&q=${q}`;
    const r = await fetch(url, {
      headers: {
        'Accept-Language': 'id',
        'User-Agent': 'Bunglonin-OjolHelper/1.0'
      }
    });
    if (!r.ok) {
      geoCache[key] = null;
      return null;
    }
    const d = await r.json();
    const c = d[0] ? { lat: +d[0].lat, lon: +d[0].lon } : null;
    geoCache[key] = c;
    // Hormati rate limit Nominatim
    await new Promise(res => setTimeout(res, 1100));
    return c;
  } catch (e) {
    console.warn('Geocode error:', e);
    geoCache[key] = null;
    return null;
  }
}

async function geocodeOrders() {
  for (const o of orders) {
    if (!o.coords) {
      o.coords = await geocode(o.dropoff);
    }
  }
}

function dist(a, b) {
  if (!a || !b) return Infinity;
  const rad = x => x * Math.PI / 180;
  const dl = rad(b.lat - a.lat), dn = rad(b.lon - a.lon);
  const v = Math.sin(dl/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dn/2)**2;
  return 6371 * 2 * Math.atan2(Math.sqrt(v), Math.sqrt(1 - v));
}

function optimize() {
  const pending = orders.filter(o => !o.done);
  const done = orders.filter(o => o.done);
  
  if (pending.length === 0) {
    orders = done;
    orders.forEach((o, i) => o.name = `Titik ${i + 1}`);
    return;
  }

  const start = currentLoc || { lat: -6.2, lon: 106.816666 };
  const sorted = [];
  const remaining = [...pending];
  let cur = start;

  while (remaining.length > 0) {
    let bestIdx = -1;
    let bestD = Infinity;

    remaining.forEach((o, i) => {
      if (!o.coords) return;
      const d = dist(cur, o.coords);
      if (d < bestD) {
        bestD = d;
        bestIdx = i;
      }
    });

    if (bestIdx === -1) {
      // Semua sisa belum punya koordinat → taruh di belakang
      sorted.push(...remaining);
      break;
    }

    const next = remaining.splice(bestIdx, 1)[0];
    sorted.push(next);
    cur = next.coords;
  }

  orders = [...done, ...sorted];
  orders.forEach((o, i) => o.name = `Titik ${i + 1}`);
}

$('recalcBtn').onclick = async () => {
  toast('Menyusun ulang rute...');
  // Clear cache yang gagal biar dicoba lagi
  orders.forEach(o => {
    if (!o.coords) delete geoCache[o.dropoff.toLowerCase().trim()];
  });
  await geocodeOrders();
  optimize();
  render();
  drawMap();
  saveState();
  toast('Rute diperbarui', 'ok');
};

function requestLoc() {
  if (!navigator.geolocation) {
    toast('Browser tidak mendukung lokasi', 'err');
    return;
  }
  toast('Meminta lokasi...');
  navigator.geolocation.getCurrentPosition(
    p => {
      currentLoc = { lat: p.coords.latitude, lon: p.coords.longitude };
      optimize();
      render();
      drawMap();
      saveState();
      toast('Lokasi didapat + rute dioptimasi', 'ok');
    },
    () => toast('Gagal mendapat lokasi', 'err'),
    { enableHighAccuracy: true, timeout: 12000 }
  );
}
$('locBtn').onclick = requestLoc;
$('locBtnTop').onclick = requestLoc;

$('allMapsBtn').onclick = () => {
  const pending = orders.filter(o => !o.done);
  if (!pending.length) {
    toast('Belum ada titik aktif', 'err');
    return;
  }
  let url = 'https://www.google.com/maps/dir/?api=1';
  if (currentLoc) url += '&origin=' + encodeURIComponent(`${currentLoc.lat},${currentLoc.lon}`);
  url += '&destination=' + encodeURIComponent(pending[pending.length - 1].dropoff);
  if (pending.length > 1) {
    url += '&waypoints=' + encodeURIComponent(pending.slice(0, -1).map(o => o.dropoff).join('|'));
  }
  url += '&travelmode=driving';
  window.open(url, '_blank', 'noopener');
};

// ================= RENDER =================
function render() {
  $('orderCount').textContent = orders.length + ' Titik';
  $('listCount').textContent = orders.length + ' Titik';
  const el = $('stopList');
  
  if (!orders.length) {
    el.innerHTML = `<div class="empty"><div class="big">Kosong</div><strong>Belum ada titik</strong><div>Tap Tambah untuk mulai.</div></div>`;
    return;
  }

  el.innerHTML = '';
  orders.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = 'stop' + (o.done ? ' done' : '');
    
    let distTxt = '';
    if (o.coords && i > 0 && orders[i-1].coords) {
      distTxt = `± ${dist(orders[i-1].coords, o.coords).toFixed(1)} km`;
    }
    const codeHtml = o.code ? `<span class="code">${escapeHtml(o.code)}</span> ` : '';
    const warnHtml = !o.coords ? `<div class="warn">⚠️ Lokasi belum ditemukan di peta</div>` : '';

    div.innerHTML = `
      <div class="stop-top">
        <div class="num">${i + 1}</div>
        <div class="stop-title">${escapeHtml(o.name)}</div>
        <span class="pill ${o.platform === 'Grab' ? 'grab' : 'shopee'}">${escapeHtml(o.platform)}</span>
      </div>
      <div class="addr">${codeHtml}${escapeHtml(o.dropoff)}</div>
      ${warnHtml}
      ${distTxt ? `<div class="meta">${distTxt}</div>` : ''}
      <div class="stop-actions">
        <button class="btn primary navbtn">Navigasi</button>
        <button class="btn ${o.done ? 'secondary' : 'green'} donebtn">${o.done ? 'Batal' : 'Selesai'}</button>
        ${!o.coords ? `<button class="btn secondary retrybtn wide">Coba Ulang Lokasi</button>` : ''}
        <button class="btn secondary copybtn wide">Salin Alamat</button>
      </div>`;

    div.querySelector('.navbtn').onclick = () => {
      window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(o.dropoff), '_blank');
    };
    
    div.querySelector('.donebtn').onclick = () => {
      o.done = !o.done;
      optimize();          // <-- penting: re-sort sisa order
      render();
      drawMap();
      saveState();
    };
    
    const retryBtn = div.querySelector('.retrybtn');
    if (retryBtn) {
      retryBtn.onclick = async () => {
        toast('Mencari lokasi...');
        delete geoCache[o.dropoff.toLowerCase().trim()];
        o.coords = await geocode(o.dropoff);
        if (o.coords) {
          optimize();
          toast('Lokasi ketemu!', 'ok');
        } else {
          toast('Masih gagal. Coba perjelas alamatnya.', 'err');
        }
        render();
        drawMap();
        saveState();
      };
    }
    
    div.querySelector('.copybtn').onclick = async () => {
      try {
        const text = (o.code ? o.code + ' - ' : '') + o.dropoff;
        await navigator.clipboard.writeText(text);
        toast('Disalin', 'ok');
      } catch (e) {}
    };
    
    div.addEventListener('click', e => {
      if (!e.target.closest('button')) openEditSheet(o);
    });
    
    el.appendChild(div);
  });
}

// ================= SHEET EDIT =================
function openSheet(html) {
  $('sheetBody').innerHTML = html;
  $('sheetBackdrop').classList.add('show');
  $('sheet').classList.add('show');
}
function closeSheet() {
  $('sheetBackdrop').classList.remove('show');
  $('sheet').classList.remove('show');
}
$('sheetBackdrop').onclick = closeSheet;

function openEditSheet(o) {
  openSheet(`
    <h2 style="margin:0 0 12px">Edit Titik</h2>
    <div class="field"><label>Platform</label>
      <select id="e_platform">
        <option value="ShopeeFood" ${o.platform==='ShopeeFood'?'selected':''}>ShopeeFood / SPX</option>
        <option value="Grab" ${o.platform==='Grab'?'selected':''}>GrabExpress</option>
      </select>
    </div>
    <div class="field"><label>Kode Pengambilan</label>
      <input id="e_code" value="${escapeHtml(o.code||'')}" placeholder="#72F9 / SPX...">
    </div>
    <div class="field"><label>Alamat</label>
      <textarea id="e_dropoff" style="min-height:100px">${escapeHtml(o.dropoff)}</textarea>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn danger" id="e_delete">Hapus</button>
      <button class="btn secondary" id="e_cancel">Batal</button>
      <button class="btn primary" id="e_save">Simpan</button>
    </div>
  `);
  $('e_cancel').onclick = closeSheet;
  $('e_delete').onclick = () => {
    if (!confirm('Hapus titik ini?')) return;
    orders = orders.filter(x => x.id !== o.id);
    optimize();
    closeSheet();
    render();
    drawMap();
    saveState();
  };
  $('e_save').onclick = async () => {
    o.platform = $('e_platform').value;
    o.code = $('e_code').value.trim();
    const newAddr = $('e_dropoff').value.trim();
    if (!newAddr) { toast('Alamat kosong', 'err'); return; }
    
    if (newAddr !== o.dropoff) {
      o.dropoff = newAddr;
      o.coords = null; // force re-geocode
    }
    closeSheet();
    render();
    saveState();
    await geocodeOrders();
    optimize();
    render();
    drawMap();
    saveState();
  };
}

// ================= MAP =================
function initMap() {
  if (!window.L) return;
  map = L.map('map').setView([-6.2, 106.816666], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);
}

function pinIcon(n, color, done = false) {
  const bg = done ? '#3a4a66' : color;
  return L.divIcon({
    className: '',
    html: `<div style="background:${bg};color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:900;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.5)">${n}</div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14]
  });
}

function drawMap() {
  if (!map) return;
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  const pts = [];
  if (currentLoc) {
    markers.push(
      L.circleMarker([currentLoc.lat, currentLoc.lon], {
        radius: 9,
        color: '#fff',
        fillColor: '#218cff',
        fillOpacity: 1,
        weight: 2
      }).addTo(map).bindPopup('Lokasi Saya')
    );
    pts.push([currentLoc.lat, currentLoc.lon]);
  }

  // Marker semua titik
  orders.forEach((o, i) => {
    if (!o.coords) return;
    const color = o.platform === 'Grab' ? '#20c58a' : '#ff8b2b';
    markers.push(
      L.marker([o.coords.lat, o.coords.lon], {
        icon: pinIcon(i + 1, color, o.done)
      }).addTo(map).bindPopup(`<b>${escapeHtml(o.name)}</b><br>${escapeHtml(o.dropoff)}`)
    );
    pts.push([o.coords.lat, o.coords.lon]);
  });

  // Route line HANYA untuk yang masih aktif (belum done)
  const activeWithCoords = orders.filter(o => !o.done && o.coords);
  if (activeWithCoords.length >= 1) {
    const linePts = [];
    if (currentLoc) linePts.push([currentLoc.lat, currentLoc.lon]);
    activeWithCoords.forEach(o => linePts.push([o.coords.lat, o.coords.lon]));
    
    if (linePts.length >= 2) {
      routeLine = L.polyline(linePts, {
        color: '#5fa8ff',
        weight: 4,
        opacity: 0.85,
        dashArray: '8 6'
      }).addTo(map);
    }
  }

  if (pts.length) {
    map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
  }
  
  const activeCount = orders.filter(o => !o.done).length;
  $('mapLabel').textContent = `${activeCount} Aktif / ${orders.length} Total`;
}

// Fullscreen
$('fullscreenBtn').onclick = () => {
  $('map').classList.toggle('fullscreen-map');
  $('closeFullscreenBtn').classList.toggle('hidden');
  setTimeout(() => map && map.invalidateSize(), 150);
};
$('closeFullscreenBtn').onclick = () => {
  $('map').classList.remove('fullscreen-map');
  $('closeFullscreenBtn').classList.add('hidden');
  setTimeout(() => map && map.invalidateSize(), 150);
};

$('markAllBtn').onclick = () => {
  orders.forEach(o => o.done = true);
  optimize();
  render();
  drawMap();
  saveState();
};

  if (!orders.some(o => o.done)) {
    toast('Tidak ada yang selesai', 'err');
    return;
  }
  orders = orders.filter(o => !o.done);
  optimize();
  render();
  drawMap();
  saveState();
};

  showTab('add');
  setTimeout(() => $('dropoff').focus(), 200);
};

loadState();

render();
drawMap();

geocodeOrders().then(() => {
  optimize();
  render();
  drawMap();
  saveState();
});

showTab('route');
